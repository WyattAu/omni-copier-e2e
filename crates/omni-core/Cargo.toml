[package]
name = "omni-core"
description = "Leaf primitives for the OmniRust template — no_std-capable, zero workspace deps (L0 pattern)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["std"]
# std — gates anything needing the OS (never silently degrade: whole items
# are gated, matching the estate no_std policy, ADR-0003).
std = []

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true

[[bench]]
name = "parse_bench"
harness = false
