# release-plz flow: PR bumping versions + CHANGELOG on every push to main;
# on merge, publish to crates.io with the vet + semver gates upstream.
# Required secret: RELEASE_PLZ_TOKEN (PAT with repo + crates.io rights).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz-pr:
    name: release-plz (PR)
    runs-on: ubuntu-latest
    # Armed via repo *variable* RELEASE_PLZ_ENABLED=true (+ secrets).
    # Fresh templates without tokens stay green (skipped) instead of red.
    if: ${{ github.repository_owner == 'WyattAu' && vars.RELEASE_PLZ_ENABLED == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-release:
    name: release-plz (publish)
    runs-on: ubuntu-latest
    # Armed via repo *variable* RELEASE_PLZ_ENABLED=true (+ secrets).
    # Fresh templates without tokens stay green (skipped) instead of red.
    if: ${{ github.repository_owner == 'WyattAu' && vars.RELEASE_PLZ_ENABLED == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

