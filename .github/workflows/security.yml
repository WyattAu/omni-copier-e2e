# Workflow security lint (zizmor) + dependency vulnerability scan (osv).
# Both are ADVISORY (continue-on-error) until the estate tunes thresholds
# (LOOP.md graduation policy).
name: security

on:
  push:
    branches: [main]
  pull_request:
  # merge_group: GitHub merge queues validate a grouped future state of main;
  # without this trigger the queue would wait forever for checks that never
  # report (research note 39). No-op until the owner enables the queue.
  merge_group:
  schedule:
    - cron: "0 8 * * 5" # Fridays 08:00 UTC

permissions: read-all

jobs:
  zizmor:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (GitHub Actions security lint)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  # Licensing compliance: REUSE spec 3.3 (machine-readable REUSE.toml +
  # LICENSES/). Advisory for one loop, then graduates (LOOP.md policy).
  reuse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install reuse
      - run: reuse lint
