# Weekly vet-imports refresh: Dependabot bumps Monday; this regenerates the
# committed supply-chain/imports.lock Tuesday and opens one PR with the diff.
name: vet-refresh

on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-vet
      # scripts are canonical: the workflow runs the same script a
      # developer runs, so the two can never drift apart.
      - run: ./scripts/vet-refresh.sh
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "chore: refresh cargo-vet imports"
          title: "chore: weekly vet-imports refresh"
          branch: vet-refresh
          delete-branch: true
