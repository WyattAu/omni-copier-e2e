[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
repository = "https://github.com/WyattAu/OmniRust-template"

# Estate tier-a lint posture: deny the panic family, take pedantic seriously,
# register the loom cfg so shared CI's model-check job stays warning-clean.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[workspace.dependencies]
# Internal deps carry explicit versions: workspace path + version keeps
# cargo-deny's wildcard check green and makes crates.io publishing work.
omni-core = { path = "crates/omni-core", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.7"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
